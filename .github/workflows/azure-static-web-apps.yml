name: Deploy to Azure Static Web Apps

on:
  push:
    branches:
      - qa
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - qa
          - production

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy_qa:
    if: github.ref == 'refs/heads/qa' && (github.event_name == 'push' || inputs.target == 'qa')
    runs-on: ubuntu-latest
    name: Deploy QA
    environment: qa
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and deploy QA
        uses: Azure/static-web-apps-deploy@v1
        env:
          VITE_APP_ENV: qa
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          api_location: ""
          output_location: dist
          app_build_command: npm run build:azure

  deploy_production:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.target == 'production')
    runs-on: ubuntu-latest
    name: Deploy production
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and deploy production
        uses: Azure/static-web-apps-deploy@v1
        env:
          VITE_APP_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          api_location: ""
          output_location: dist
          app_build_command: npm run build:azure