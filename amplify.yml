version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # AWS Amplify provides the AWS_BRANCH environment variable automatically (e.g., 'main', 'staging', 'develop')
        # We map these to our Vite .env modes
        - |
          if [ "${AWS_BRANCH}" = "main" ]; then
            npm run build -- --mode production
          elif [ "${AWS_BRANCH}" = "staging" ]; then
            npm run build -- --mode staging
          elif [ "${AWS_BRANCH}" = "develop" ]; then
            npm run build -- --mode qa
          else
            npm run build
          fi
  artifacts:
    # Vite outputs the production build to the 'dist' directory by default
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      # Cache node_modules to significantly speed up future CI/CD deployments
      - node_modules/**/*
